<!DOCTYPE html>			
<html>			
<body>			
			
<h1>BLE TEST 2</h1>			
			
<button onclick="testBLE()">			
Bluetooth検索			
</button>			
			
<script>			
async function testBLE() {			
try {			
const device = await navigator.bluetooth.requestDevice({			
acceptAllDevices: true			
});			
			
alert("見つかったデバイス: " + device.name);			
			
} catch (error) {			
alert("エラー: " + error);			
}			
}			
</script>			
			
</body>			
</html>
