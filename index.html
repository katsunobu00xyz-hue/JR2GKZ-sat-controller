<!DOCTYPE html>		
<html>		
<body>		
		
<h1>BLE TEST 4</h1>		
		
<button onclick="testBLE()">		
Bluetooth接続		
</button>
<div id="received">	
ESP32からの受信：なし	
</div>	
		
<button onclick="sendHello()">		
HELLO送信		
</button>		
		
<script>		

const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";				
const RX_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";				
		
let rxCharacteristic = null;
let txCharacteristic = null;
		
async function testBLE() {		
		
try {		
		
const device = await navigator.bluetooth.requestDevice({		
acceptAllDevices: true,		
optionalServices: [SERVICE_UUID]		
});		
		
alert("見つかったデバイス: " + device.name);		
		
const server = await device.gatt.connect();		
		
const service =		
await server.getPrimaryService(SERVICE_UUID);		
		
rxCharacteristic =		
await service.getCharacteristic(RX_UUID);
txCharacteristic =		
await service.getCharacteristic(		
6e400003-b5a3-f393-e0a9-e50e24dcca9e		
);		
		
await txCharacteristic.startNotifications();		
		
txCharacteristic.addEventListener(		
characteristicvaluechanged,		
(event) => {		
		
const value =		
new TextDecoder().decode(		
event.target.value		
);		
		
document.getElementById("received").innerText =		
ESP32からの受信： + value;				
}		
);		
		
alert("接続成功！");		
		
} catch (error) {		
		
alert("エラー: " + error);		
		
}		
}		
		
		
async function sendHello() {		
		
if (!rxCharacteristic) {		
		
alert("先にBluetooth接続してください");		
		
return;		
}		
		
const data =		
new TextEncoder().encode("HELLO");		
		
await rxCharacteristic.writeValue(data);		
		
alert("HELLOを送信しました！");		
		
}		
		
</script>		
		
</body>		
</html>
