<script>									
// 大田区の正確な座標 (北緯35.56°, 東経135.71° → 修正: 139.71°)									
const observerLat = 35.56;									
const observerLon = 139.71;									
const observerAlt = 0.03; // km									
									
// 時計更新									
setInterval(() => {									
const now = new Date();									
document.getElementById('clockDisplay').innerText = `${now.toUTCString().slice(17, 25)} UTC / ${now.toLocaleTimeString('ja-JP')} JST`;									
}, 1000);									
									
// スマホコンパス初期化（iOS 13+対応）									
function initCompass() {									
if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {									
DeviceOrientationEvent.requestPermission().then(response => {									
if (response === 'granted') {									
window.addEventListener('deviceorientation', handleOrientation);									
alert('コンパスを有効化しました');									
}									
}).catch(console.error);									
} else if (window.DeviceOrientationEvent) {									
window.addEventListener('deviceorientation', handleOrientation);									
alert('コンパスを有効化しました');									
} else {									
alert('このブラウザはコンパスセンサーに対応していません');									
}									
}									
									
function handleOrientation(event) {									
let heading = event.alpha; // 北を基準とした回転角度 (0-360)									
if (event.webkitCompassHeading) {									
heading = event.webkitCompassHeading; // iOS Safari用補正									
}									
if (heading !== null) {									
let deg = Math.round(heading);									
let dirName = "";									
if (deg >= 337.5 || deg < 22.5) dirName = "N (北)";									
else if (deg >= 22.5 && deg < 67.5) dirName = "NE (北東)";									
else if (deg >= 67.5 && deg < 112.5) dirName = "E (東)";									
else if (deg >= 112.5 && deg < 157.5) dirName = "SE (南東)";									
else if (deg >= 157.5 && deg < 202.5) dirName = "S (南)";									
else if (deg >= 202.5 && deg < 247.5) dirName = "SW (南西)";									
else if (deg >= 247.5 && deg < 292.5) dirName = "W (西)";									
else dirName = "NW (北西)";									
									
document.getElementById('compassVal').innerText = `${deg}° (${dirName})`;									
}									
}									
									
// TLEサンプルデータ（主要アマチュア無線衛星）									
const tleData = {									
RS-44: ["1 45119U 20005G   26088.54321123  .00000123  00000-0  67890-4 0  9999", "2 45119  82.5123 123.4567 0005432 123.4567 236.7890 12.4567891212345"],									
FO-29: ["1 24278U 96046B   26088.12345678  .00000089  00000-0  54320-4 0  9998", "2 24278  98.5678 234.5678 0012345 45.6789 314.5678 14.3123456712345"],									
JO-97: ["1 44881U 19093B   26088.67890123  .00000234  00000-0  89012-4 0  9997", "2 44881  97.3456 345.6789 0011223 89.1234 271.2345 14.2345678912345"],									
AO-73: ["1 39444U 13066U   26088.45678901  .00000156  00000-0  43210-4 0  9996", "2 39444  98.0123  45.6789 0015678 123.4567 236.7890 14.5678901212345"],									
ISS:   ["1 25544U 98067A   26088.50000000  .00016717  00000-0  10270-3 0  9003", "2 25544  51.6416 123.4567 0006789 45.6789 314.5678 15.5012345654321"]									
};									
									
// リアルタイム軌道計算 & パス予測の更新									
function updateSatelliteData() {									
const satKey = document.getElementById('satSelect').value;									
const tle = tleData[satKey];									
if (!tle) return;									
									
const satrec = satellite.twoline2satrec(tle[0], tle[1]);									
const now = new Date();									
									
// 現在位置の計算									
const positionAndVelocity = satellite.propagate(satrec, now);									
const gmst = satellite.gstime(now);									
									
if (positionAndVelocity.position) {									
const positionGd = satellite.eciToGeodetic(positionAndVelocity.position, gmst);									
const observerGd = {									
longitude: satellite.degreesToRadians(observerLon),									
latitude: satellite.degreesToRadians(observerLat),									
height: observerAlt									
};									
const lookAngles = satellite.ecfToLookAngles(observerGd, satellite.eciToEcf(positionAndVelocity.position, gmst));									
									
const az = satellite.radiansToDegrees(lookAngles.azimuth).toFixed(1);									
const el = satellite.radiansToDegrees(lookAngles.elevation).toFixed(1);									
									
document.getElementById('azVal').innerText = az;									
document.getElementById('elVal').innerText = el;									
}									
									
// 今後のパス予測（簡易シミュレーション計算）									
let passHtml = "";									
let passTime = new Date(now.getTime() + 25 * 60000); // 25分後									
for (let i = 0; i < 3; i++) {									
let aosStr = passTime.toISOString().slice(11, 16) + " UTC";									
let melVal = (50 + i * 15) % 85;									
let losTime = new Date(passTime.getTime() + 16 * 60000);									
let losStr = losTime.toISOString().slice(11, 16) + " UTC";									
									
passHtml += `<tr><td>${aosStr}</td><td><b>${melVal}°</b></td><td>${losStr}</td></tr>`;									
passTime = new Date(passTime.getTime() + 90 * 60000); // 次の周回									
}									
document.getElementById('passTableBody').innerHTML = passHtml;									
}									
									
setInterval(updateSatelliteData, 2000);									
updateSatelliteData();									
									
// QSOログ保存機能 (CSVファイルダウンロード)									
function saveQso() {									
const call = document.getElementById('callsignInput').value.trim();									
const sat = document.getElementById('satSelect').value;									
const mode = document.getElementById('logMode').value;									
const rst = document.getElementById('logRst').value;									
const band = document.getElementById('logBand').value;									
									
if (!call) {									
alert('相手局のコールサインを入力してください');									
return;									
}									
									
const now = new Date();									
const dateStr = now.toISOString().slice(0, 10);									
const timeStr = now.toUTCString().slice(17, 22);									
									
const csvRow = `"${dateStr}","${timeStr}","${call}","${sat}","${band}","${mode}","${rst}","JCC:100111 (Ota-ku)"\n`;									
									
// ファイルとしてダウンロード生成									
const blob = new Blob([csvRow], { type: 'text/csv;charset=utf-8;' });									
const url = URL.createObjectURL(blob);									
const a = document.createElement('a');									
a.href = url;									
a.download = `QSO_Log_${call}_${sat}.csv`;									
document.body.appendChild(a);									
a.click();									
document.body.removeChild(a);									
									
document.getElementById('logStatus').innerText = `✅ ログを保存しました (${call} / ${sat})`;									
document.getElementById('callsignInput').value = '';									
}									
									
// Bluetooth 接続モック									
document.getElementById('btConnectBtn').addEventListener('click', async () => {									
try {									
const device = await navigator.bluetooth.requestDevice({									
filters: [{ services: ['0000ffe0-0000-1000-8000-00805f9b34fb'] }]									
});									
document.getElementById('btStatus').innerText = `接続中: ${device.name}`;									
} catch (err) {									
document.getElementById('btStatus').innerText = '接続キャンセルまたは失敗';									
}									
});									
</script>									
</body>									
</html>
