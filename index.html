<!DOCTYPE html>		
<html>		
<body>		
		
<h1>BLE TEST</h1>		
		
<button onclick="testBLE()">		
Bluetooth接続		
</button>		
		
<script>		
async function testBLE() {		
		
try {		
		
const device = await navigator.bluetooth.requestDevice({		
acceptAllDevices: true		
});		
		
alert("見つかったデバイス: " + device.name);		
		
const server = await device.gatt.connect();		
		
alert("接続成功！");		
		
} catch (error) {		
		
alert("エラー: " + error);		
		
}		
}		
</script>		
		
</body>		
</html>
