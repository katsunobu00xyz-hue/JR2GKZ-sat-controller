<!DOCTYPE html>												
<html lang="ja">												
<head>												
<meta charset="UTF-8">												
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">												
<title>JR2GKZ Satellite & Doppler Station</title>												
<style>												
:root {												
--bg-color: #121212;												
--card-bg: #1e1e1e;												
--accent-green: #00ff66;												
--text-main: #e0e0e0;												
--text-muted: #888888;												
--border-color: #333333;												
}												
body {												
background-color: var(--bg-color);												
color: var(--text-main);												
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;												
margin: 0;												
padding: 12px;												
box-sizing: border-box;												
}												
h1 {												
color: var(--accent-green);												
text-align: center;												
font-size: 1.2rem;												
margin-bottom: 12px;												
}												
.card {												
background-color: var(--card-bg);												
border-radius: 12px;												
padding: 12px;												
margin-bottom: 12px;												
box-shadow: 0 4px 6px rgba(0,0,0,0.3);												
border: 1px solid var(--border-color);												
}												
.btn {												
background-color: var(--accent-green);												
color: #000;												
border: none;												
border-radius: 8px;												
padding: 12px;												
font-size: 1rem;												
font-weight: bold;												
width: 100%;												
cursor: pointer;												
text-align: center;												
}												
.label {												
font-size: 0.75rem;												
color: var(--text-muted);												
margin-bottom: 4px;												
}												
.value {												
font-size: 1.1rem;												
font-weight: bold;												
color: var(--accent-green);												
}												
select, input {												
width: 100%;												
background-color: #2a2a2a;												
color: #fff;												
border: 1px solid var(--border-color);												
border-radius: 6px;												
padding: 8px;												
font-size: 1rem;												
margin-top: 4px;												
box-sizing: border-box;												
}												
.flex-row {												
display: flex;												
gap: 8px;												
}												
.flex-col {												
flex: 1;												
}												
table {												
width: 100%;												
font-size: 0.85rem;												
border-collapse: collapse;												
margin-top: 8px;												
}												
th, td {												
border-bottom: 1px solid var(--border-color);												
padding: 6px;												
text-align: left;												
}												
th { color: var(--text-muted); }												
</style>												
</head>												
<body>												
												
<h1>🛰️ JR2GKZ Sat & Doppler Station</h1>												
												
<!-- Bluetooth 接続 -->												
<div class="card">												
<button class="btn" id="btConnectBtn">Bluetooth 接続 (ESP32)</button>												
<div id="btStatus" class="label" style="text-align: center; margin-top: 6px;">未接続</div>												
</div>												
												
<!-- 衛星選択 & 時間 -->												
<div class="card">												
<div class="flex-row">												
<div class="flex-col">												
<div class="label">対象衛星</div>												
<select id="satSelect">												
<option value="RS-44">RS-44 (DOSAAF-85)</option>												
<option value="FO-29">FO-29 (Fuji-3)</option>												
<option value="JO-97">JO-97 (TEN-DOS)</option>												
<option value="AO-73">AO-73 (FUNcube-1)</option>												
<option value="ISS">ISS (International Space Station)</option>												
</select>												
</div>												
</div>												
<div style="margin-top: 8px;">												
<div class="label">UTC / JST Clock</div>												
<div id="clockDisplay" class="value" style="font-size: 0.95rem;">--:--:-- UTC / --:--:-- JST</div>												
</div>												
</div>												
												
<!-- 位置・コンパス情報 -->												
<div class="card">												
<div class="flex-row">												
<div class="flex-col">												
<div class="label">位置 / グリッド / JCC</div>												
<div class="value" style="font-size: 0.9rem;">Ota-ku, Tokyo (PM95vn)<br>JCC: 100106</div>												
</div>												
<div class="flex-col" style="text-align: right;">												
<div class="label">スマホ方位 (コンパス)</div>												
<div id="compassVal" class="value">--°</div>												
</div>												
</div>												
</div>												
												
<!-- リアルタイム追尾 (方位・仰角) -->												
<div class="card" style="text-align: center;">												
<div class="label">アンテナ方位 / 仰角 (リアルタイム)</div>												
<div style="font-size: 1.8rem; font-weight: bold; margin: 8px 0;">												
AZ: <span id="azVal">--.-</span>° / EL: <span id="elVal">--.-</span>°												
</div>												
</div>												
												
<!-- パス予測リスト (AOS / MEL / LOS) -->												
<div class="card">												
<div class="label">今後の通過予測パス (AOS / MEL / LOS)</div>												
<div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px;">※直近のパス予測スケジュール</div>												
<table id="passTable">												
<thead>												
<tr>												
<th>AOS (見出)</th>												
<th>MEL (最大仰)</th>												
<th>LOS (見終)</th>												
</tr>												
</thead>												
<tbody id="passTableBody">												
<tr><td colspan="3" style="text-align: center;">計算中...</td></tr>												
</tbody>												
</table>												
</div>												
												
<!-- 交信ログ機能 (QSO Logger) -->												
<div class="card">												
<div class="label">📝 QSO ログ記録</div>												
<div class="flex-row" style="margin-top: 4px;">												
<input type="text" id="callsignInput" placeholder="相手局コールサイン (例: JH1XYZ)" style="flex: 2;">												
<select id="modeInput" style="flex: 1;">												
<option value="SSB">SSB</option>												
<option value="CW">CW</option>												
<option value="FT8">FT8</option>												
</select>												
</div>												
<button class="btn" style="margin-top: 8px; background-color: #333; color: var(--accent-green); font-size: 0.9rem; padding: 8px;" onclick="saveQso()">ログに保存する</button>												
<div id="logStatus" class="label" style="margin-top: 4px; text-align: center;"></div>												
</div>												
												
<script>												
// 時計更新												
setInterval(() => {												
const now = new Date();												
const utc = now.toUTCString().slice(17, 25);												
const jst = now.toLocaleTimeString('ja-JP');												
document.getElementById('clockDisplay').innerText = `${utc} UTC / ${jst} JST`;												
}, 1000);												
												
// コンパス（スマホの向き）取得												
if (window.DeviceOrientationEvent) {												
window.addEventListener('deviceorientation', (event) => {												
let alpha = event.alpha; // 0-360												
if (alpha !== null) {												
document.getElementById('compassVal').innerText = Math.round(alpha) + '°';												
}												
});												
}												
												
// ダミーのリアルタイム・パス計算表示（動作確認用）												
function updateTracking() {												
// デモ用の動的シミュレーション値（実際の位置計算ロジックと連動可能）												
const az = (Math.random() * 360).toFixed(1);												
const el = (Math.random() * 90 - 10).toFixed(1);												
document.getElementById('azVal').innerText = az;												
document.getElementById('elVal').innerText = el;												
												
// パス予測のサンプル表示												
document.getElementById('passTableBody').innerHTML = `												
<tr><td>12:45 UTC</td><td>48° (SE)</td><td>13:01 UTC</td></tr>												
<tr><td>14:22 UTC</td><td>72° (SSW)</td><td>14:38 UTC</td></tr>												
`;												
}												
setInterval(updateTracking, 3000);												
updateTracking();												
												
// QSOログ保存機能												
function saveQso() {												
const call = document.getElementById('callsignInput').value;												
const mode = document.getElementById('modeInput').value;												
const sat = document.getElementById('satSelect').value;												
if(!call) {												
alert('コールサインを入力してください');												
return;												
}												
const logText = `保存成功: ${call} (${sat} / ${mode}) at ${new Date().toISOString()}`;												
document.getElementById('logStatus').innerText = logText;												
document.getElementById('callsignInput').value = '';												
}												
												
// Bluetooth接続ボタンのモック処理												
document.getElementById('btConnectBtn').addEventListener('click', async () => {												
try {												
const device = await navigator.bluetooth.requestDevice({												
filters: [{ services: ['0000ffe0-0000-1000-8000-00805f9b34fb'] }] // 標準的なESP32用UUID等												
});												
document.getElementById('btStatus').innerText = `接続中: ${device.name}`;												
} catch (err) {												
document.getElementById('btStatus').innerText = '接続キャンセルまたは失敗';												
}												
});												
</script>												
</body>												
</html>
