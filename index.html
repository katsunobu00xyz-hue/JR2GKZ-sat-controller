<!DOCTYPE html>			
<html lang="ja">			
<head>			
<meta charset="UTF-8">			
<meta name="viewport" content="width=device-width, initial-scale=1.0">			
<title>JR2GKZ ESP32 TEST</title>			
			
<style>			
body {			
background-color: #121212;			
color: white;			
font-family: sans-serif;			
text-align: center;			
padding-top: 40px;			
}			
			
button {			
font-size: 20px;			
padding: 15px 25px;			
margin: 10px;			
border-radius: 8px;			
}			
			
#status {			
margin-top: 20px;			
font-size: 18px;			
}			
</style>			
</head>			
			
<body>			
			
<h1>JR2GKZ ESP32 TEST</h1>			
			
<button onclick="connectBLE()">Bluetooth接続</button>			
			
<button onclick="sendHello()">HELLO送信</button>			
			
<div id="status">未接続</div>			
			
<script>			
			
const SERVICE_UUID =			
6e400001-b5a3-f393-e0a9-e50e24dcca9e;			
			
const RX_UUID =			
6e400002-b5a3-f393-e0a9-e50e24dcca9e;			
			
let device = null;			
let server = null;			
let rxCharacteristic = null;			
			
async function connectBLE() {			
			
try {			
			
document.getElementById("status").innerText =			
Bluetooth検索中...;			
			
device = await navigator.bluetooth.requestDevice({			
filters: [			
{ services: [SERVICE_UUID] }			
],			
optionalServices: [SERVICE_UUID]			
});			
			
document.getElementById("status").innerText =			
接続中...;			
			
server = await device.gatt.connect();			
			
const service =			
await server.getPrimaryService(SERVICE_UUID);			
			
rxCharacteristic =			
await service.getCharacteristic(RX_UUID);			
			
document.getElementById("status").innerText =			
接続成功！;			
			
} catch (error) {			
			
console.log(error);			
			
document.getElementById("status").innerText =			
接続失敗;			
			
alert("エラー: " + error);			
}			
}			
			
async function sendHello() {			
			
try {			
			
if (!rxCharacteristic) {			
alert("先にBluetooth接続してください");			
return;			
}			
			
const data =			
new TextEncoder().encode("HELLO");			
			
await rxCharacteristic.writeValue(data);			
			
document.getElementById("status").innerText =			
HELLOを送信しました！;			
			
} catch (error) {			
			
console.log(error);			
			
alert("送信エラー: " + error);			
}			
}			
			
</script>			
			
</body>			
</html>
