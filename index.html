<!DOCTYPE html>		
<html lang="ja">		
		
<head>		
		
<meta charset="UTF-8">		
		
<meta name="viewport"		
content="width=device-width, initial-scale=1.0">		
		
<title>JR2GKZ ESP32 TEST</title>		
		
<style>		
		
body {		
background: #121212;		
color: white;		
font-family: sans-serif;		
text-align: center;		
padding: 30px 15px;		
}		
		
button {		
display: block;		
width: 90%;		
max-width: 400px;		
margin: 15px auto;		
padding: 18px;		
font-size: 20px;		
font-weight: bold;		
border: none;		
border-radius: 10px;		
}		
		
#connectBtn {		
background: #00ff00;		
color: black;		
}		
		
.test {		
background: #008cff;		
color: white;		
}		
		
#status {		
margin: 25px;		
font-size: 20px;		
}		
		
#log {		
background: black;		
color: white;		
text-align: left;		
padding: 15px;		
min-height: 150px;		
white-space: pre-wrap;		
border-radius: 8px;		
}		
		
</style>		
		
</head>		
		
<body>		
		
<h1>JR2GKZ ESP32 TEST</h1>		
		
<div id="status">		
JavaScript確認中...		
</div>		
		
<button id="connectBtn" onclick="connectBLE()">		
Bluetooth 接続		
</button>		
		
<button class="test" onclick="sendTest()">		
TEST送信		
</button>		
		
<button class="test" onclick="sendHello()">		
HELLO送信		
</button>		
		
<div id="log">		
ログ：		
</div>		
		
		
<script>		
		
const SERVICE_UUID =		
6e400001-b5a3-f393-e0a9-e50e24dcca9e;		
		
const RX_UUID =		
6e400002-b5a3-f393-e0a9-e50e24dcca9e;		
		
const TX_UUID =		
6e400003-b5a3-f393-e0a9-e50e24dcca9e;		
		
		
let rxCharacteristic = null;		
let txCharacteristic = null;		
		
		
/* JavaScript確認 */		
		
document.getElementById("status").innerText =		
JavaScript OK;		
		
		
function log(text) {		
		
document.getElementById("log").innerText +=		
\n + text;		
		
}		
		
		
/* Bluetooth接続 */		
		
async function connectBLE() {		
		
log("接続ボタンが押されました");		
		
try {		
		
document.getElementById("status").innerText =		
Bluetooth検索中...;		
		
		
const device =		
await navigator.bluetooth.requestDevice({		
		
filters: [		
{		
services: [SERVICE_UUID]		
}		
],		
		
optionalServices: [		
SERVICE_UUID		
]		
		
});		
		
		
log("発見：" + device.name);		
		
		
document.getElementById("status").innerText =		
接続中...;		
		
		
const server =		
await device.gatt.connect();		
		
		
log("GATT接続成功");		
		
		
const service =		
await server.getPrimaryService(		
SERVICE_UUID		
);		
		
		
log("Service取得成功");		
		
		
rxCharacteristic =		
await service.getCharacteristic(		
RX_UUID		
);		
		
		
txCharacteristic =		
await service.getCharacteristic(		
TX_UUID		
);		
		
		
log("RX/TX取得成功");		
		
		
await txCharacteristic.startNotifications();		
		
		
txCharacteristic.addEventListener(		
characteristicvaluechanged,		
function(event) {		
		
const decoder =		
new TextDecoder();		
		
const text =		
decoder.decode(		
event.target.value		
);		
		
		
log(		
ESP32 → iPhone :  +		
text		
);		
		
}		
);		
		
		
document.getElementById("status").innerText =		
● Bluetooth接続完了;		
		
		
log("BLE通信準備完了");		
		
		
} catch(error) {		
		
document.getElementById("status").innerText =		
接続エラー;		
		
		
log(		
ERROR:  +		
error.name +		
 /  +		
error.message		
);		
		
}		
		
}		
		
		
/* TEST */		
		
async function sendTest() {		
		
log("TESTボタンが押されました");		
		
await sendText("TEST");		
		
}		
		
		
/* HELLO */		
		
async function sendHello() {		
		
log("HELLOボタンが押されました");		
		
await sendText("HELLO");		
		
}		
		
		
/* ESP32へ送信 */		
		
async function sendText(text) {		
		
if (!rxCharacteristic) {		
		
log("まだBluetooth接続されていません");		
		
return;		
		
}		
		
		
try {		
		
const encoder =		
new TextEncoder();		
		
		
await rxCharacteristic.writeValue(		
encoder.encode(text)		
);		
		
		
log(		
iPhone → ESP32 :  +		
text		
);		
		
		
} catch(error) {		
		
log(		
送信エラー： +		
error.message		
);		
		
}		
		
}		
		
</script>		
		
</body>		
		
</html>
