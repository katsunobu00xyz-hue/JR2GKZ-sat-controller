<!DOCTYPE html>				
<html lang="ja">				
				
<head>				
<meta charset="UTF-8">				
<meta name="viewport" content="width=device-width, initial-scale=1.0">				
				
<title>JR2GKZ ESP32 BLE TEST</title>				
</head>				
				
<body>				
				
<h1>JR2GKZ BLE TEST</h1>				
				
<br>				
				
<button onclick="testBLE()">				
Bluetooth接続				
</button>				
				
<br><br>				
				
<button onclick="sendHello()">				
HELLO送信				
</button>				
				
<br><br>				
				
<div id="status">				
ステータス：未接続				
</div>				
				
<br>				
				
<div id="received">				
ESP32からの受信：なし				
</div>				
				
				
<script>				
				
const SERVICE_UUID =				
6e400001-b5a3-f393-e0a9-e50e24dcca9e;				
				
const RX_UUID =				
6e400002-b5a3-f393-e0a9-e50e24dcca9e;				
				
const TX_UUID =				
6e400003-b5a3-f393-e0a9-e50e24dcca9e;				
				
				
let rxCharacteristic = null;				
				
let txCharacteristic = null;				
				
				
async function testBLE() {				
				
alert("Bluetooth接続ボタンは動いています");				
				
				
try {				
				
document.getElementById("status").innerText =				
ステータス：デバイス検索中...;				
				
				
const device =				
await navigator.bluetooth.requestDevice({				
				
acceptAllDevices: true,				
				
optionalServices: [				
SERVICE_UUID				
]				
				
});				
				
				
alert(				
見つかったデバイス：				
#NAME?				
);				
				
				
document.getElementById("status").innerText =				
ステータス：接続中...;				
				
				
const server =				
await device.gatt.connect();				
				
				
const service =				
await server.getPrimaryService(				
SERVICE_UUID				
);				
				
				
rxCharacteristic =				
await service.getCharacteristic(				
RX_UUID				
);				
				
				
txCharacteristic =				
await service.getCharacteristic(				
TX_UUID				
);				
				
				
await txCharacteristic.startNotifications();				
				
				
txCharacteristic.addEventListener(				
characteristicvaluechanged,				
function(event) {				
				
const value =				
new TextDecoder().decode(				
event.target.value				
);				
				
				
document.getElementById(				
received				
).innerText =				
ESP32からの受信： + value;				
				
}				
);				
				
				
document.getElementById("status").innerText =				
ステータス：接続完了;				
				
				
alert("BLE接続成功！");				
				
				
} catch (error) {				
				
console.log(error);				
				
document.getElementById("status").innerText =				
ステータス：接続失敗;				
				
				
alert(				
エラー：				
#NAME?				
);				
				
}				
				
}				
				
				
async function sendHello() {				
				
if (rxCharacteristic === null) {				
				
alert(				
先にBluetooth接続してください				
);				
				
return;				
				
}				
				
				
try {				
				
const data =				
new TextEncoder().encode(				
HELLO				
);				
				
				
await rxCharacteristic.writeValue(				
data				
);				
				
				
alert(				
HELLOを送信しました！				
);				
				
				
} catch (error) {				
				
console.log(error);				
				
alert(				
送信エラー：				
#NAME?				
);				
				
}				
				
}				
				
</script>				
				
</body>				
				
</html>
